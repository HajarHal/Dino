# Taxonomie canonique : garanties auto et produits.
# Modifier ce fichier suffit pour ajouter une garantie ou un alias de libellé de CP.
# Les alias sont comparés après normalisation (minuscules, sans accents ni ponctuation).
# Les noms proviennent des CG AXA « Solution Auto », Sanlam « Assur'Auto Plus » et des CP scannées.

# keywords : dernier recours si le libellé n'est ni un alias ni proche d'un alias. Chaque élément est un groupe
# de mots qui doivent tous figurer dans le libellé ; le groupe le plus long gagne ; égalité entre deux garanties = non reconnu.
guarantees:
